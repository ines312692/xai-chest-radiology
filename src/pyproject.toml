[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-chest"
version = "1.0.0"
description = "Multimodal explainable AI for chest radiology, Master 2 ISI"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pydicom>=2.4",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "grad-cam>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["xai_chest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
